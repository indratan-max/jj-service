<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/logo.jpg"><title>Admin • JJ SERVICE</title><link rel="stylesheet" href="style.css"></head><body><header><a class="brand" href="/"><img src="/logo.jpg" alt="JJ SERVICE"><span>JJ SERVICE<small>ADMIN DASHBOARD</small></span></a><nav><a href="/">Beranda</a><a href="/cek.html">Cek Status</a><a href="/reservasi.html">Reservasi</a></nav></header><main class="page"><section class="stats"><div><b id="total">0</b><span>Total</span></div><div><b id="work">0</b><span>Proses</span></div><div><b id="done">0</b><span>Selesai</span></div></section><div class="card"><p class="eyebrow">TIKET BARU</p><form id="form"><div class="grid"><input name="name" placeholder="Nama pelanggan" required><input name="phone" placeholder="WhatsApp" required></div><div class="grid"><input name="device" placeholder="Tipe HP" required><input name="cost" placeholder="Estimasi biaya"></div><textarea name="issue" placeholder="Keluhan" required></textarea><button>Buat Tiket</button></form></div><div class="card"><h2>Daftar Tiket</h2><div id="list"></div></div></main><script>
const S={received:"HP Diterima",checking:"Sedang Diperiksa",waiting:"Menunggu Sparepart / Persetujuan",repairing:"Sedang Dikerjakan",done:"Sudah Selesai",picked:"Sudah Diambil"};
async function load(){let [a,b]=await Promise.all([fetch("/api/admin/tickets"),fetch("/api/admin/stats")]);let ts=await a.json(),st=await b.json();total.textContent=st.total;work.textContent=st.work;done.textContent=st.done;list.innerHTML=ts.map(t=>`<article class="row"><div><b>${t.ticket_no}</b><strong>${t.name} • ${t.device}</strong><small>${t.issue}</small></div><div><select onchange="upd('${t.ticket_no}',this.value)">${Object.entries(S).map(([k,v])=>`<option value="${k}" ${k===t.status?"selected":""}>${v}</option>`).join("")}</select><input class="cost" value="${t.cost||""}" placeholder="Estimasi" onchange="cost('${t.ticket_no}',this.value)"><a target="_blank" href="/cek.html?ticket=${encodeURIComponent(t.ticket_no)}">Lihat</a><button class="danger" onclick="del('${t.ticket_no}')">Hapus</button></div></article>`).join("")||"<p class='muted'>Belum ada tiket.</p>"}
form.onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(form));let r=await fetch("/api/admin/tickets",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)});let x=await r.json();if(r.ok){alert("Tiket "+x.ticket_no+" dibuat");form.reset();load()}else alert(x.error)}
async function upd(n,s){await fetch("/api/admin/tickets/"+encodeURIComponent(n),{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({status:s})});load()}
async function cost(n,c){await fetch("/api/admin/tickets/"+encodeURIComponent(n),{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({cost:c})})}
async function del(n){if(confirm("Hapus tiket "+n+"?")){await fetch("/api/admin/tickets/"+encodeURIComponent(n),{method:"DELETE"});load()}}
load();
</script></body></html>
