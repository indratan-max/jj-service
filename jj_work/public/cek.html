<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/logo.jpg"><title>Cek Status • JJ SERVICE</title><link rel="stylesheet" href="style.css"></head><body>
<header><a class="brand" href="/"><img src="/logo.jpg" alt="JJ SERVICE"><span>JJ SERVICE<small>CEK STATUS SERVIS</small></span></a><nav><a href="/">Beranda</a><a class="active" href="/cek.html">Cek Status</a><a href="/reservasi.html">Reservasi</a></nav></header>
<main class="page"><div class="card"><p class="eyebrow">TRACKING TIKET</p><h1>Cek Status HP</h1><p class="muted">Masukkan nomor tiket untuk melihat progres servis.</p><div class="search"><input id="no" placeholder="Contoh: JJ-260921-001"><button onclick="cek()">Cek</button></div><div id="result"></div></div></main><script>const q=new URLSearchParams(location.search).get("ticket");if(q){no.value=q;cek()} async function cek(){let n=no.value.trim();if(!n)return;let r=await fetch("/api/public/ticket/"+encodeURIComponent(n));let d=await r.json();if(!r.ok){result.innerHTML='<p class="error">Tiket tidak ditemukan.</p>';return}result.innerHTML=`<div class="ticket"><h2>${d.ticket_no}</h2><p><b>${d.device}</b></p><div class="status">${d.status_label}</div><p>Pelanggan: ${d.name}</p><p>Keluhan: ${d.issue}</p><p>Estimasi: ${d.cost||"Menunggu pemeriksaan"}</p><p class="muted">Update: ${new Date(d.updated_at+"Z").toLocaleString("id-ID")}</p><img class="qr" src="/api/qr/${encodeURIComponent(d.ticket_no)}"></div>`}</script></body></html>
