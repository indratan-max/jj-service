<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/logo.jpg"><title>Reservasi • JJ SERVICE</title><link rel="stylesheet" href="style.css"></head><body><header><a class="brand" href="/"><img src="/logo.jpg" alt="JJ SERVICE"><span>JJ SERVICE<small>RESERVASI</small></span></a><nav><a href="/">Beranda</a><a href="/cek.html">Cek Status</a><a class="active" href="/reservasi.html">Reservasi</a></nav></header><main class="page"><div class="card"><p class="eyebrow">BOOKING SERVIS</p><h1>Reservasi</h1><p class="muted">Pilih waktu yang nyaman untuk datang ke JJ SERVICE.</p><form id="f"><input name="name" placeholder="Nama" required><input name="phone" placeholder="Nomor WhatsApp" required><div class="grid"><input name="date" type="date" required><input name="time" type="time" required></div><input name="device" placeholder="Tipe HP" required><textarea name="issue" placeholder="Keluhan / kerusakan" required></textarea><button>Konfirmasi Reservasi</button></form><div id="msg"></div></div></main><script>f.onsubmit=async e=>{e.preventDefault();let data=Object.fromEntries(new FormData(f));let r=await fetch("/api/reservations",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});let d=await r.json();if(!r.ok){msg.innerHTML='<p class="error">'+d.error+'</p>';return}let text=`Halo JJ SERVICE, saya ingin reservasi.%0A%0ANama: ${data.name}%0AWhatsApp: ${data.phone}%0ATanggal: ${data.date}%0AJam: ${data.time}%0AHP: ${data.device}%0AKeluhan: ${data.issue}`;msg.innerHTML='<p class="success">Reservasi tersimpan.</p><a class="btn" target="_blank" href="https://wa.me/6289675599832?text='+text+'">Kirim ke WhatsApp</a>';f.reset()}</script></body></html>
